stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - ftp
  script:
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - |
      lftp -c "
        set ftp:ssl-force true;
        set ftp:ssl-protect-data true;
        set ssl:verify-certificate true;
        open $CDN_HOST:$CDN_PORT;
        user $CDN_USER $CDN_PASSWORD;
        mkdir -p $CDN_DIRECTORY/$RELEASE_VERSION;
        mirror -R compiled-css/ $CDN_DIRECTORY/$RELEASE_VERSION/;
        bye
      "
  only:
    - tags
