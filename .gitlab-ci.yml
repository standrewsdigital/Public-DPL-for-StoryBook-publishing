stages:
  - compile
  - deploy

compile:
  stage: compile
  tags:
    - docker
  image: node:26-alpine
  before_script:
    - npm config set proxy "http://${PROXY_HOST}:${PROXY_PORT}"
    - npm config set https-proxy "http://${PROXY_HOST}:${PROXY_PORT}"
    - npm install -g sass
  script:
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - mkdir $RELEASE_VERSION
    - sass --style=compressed --embed-sources scss-styles/:$RELEASE_VERSION/
  artifacts:
    paths:
      - ./$RELEASE_VERSION
    expire_in: 10 mins
  only:
    - tags

deploy:
  stage: deploy
  tags:
    - ftp
  script:
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - |
      lftp -c "
        set ftp:ssl-force true;
        set ftp:ssl-protect-data true;
        set ssl:verify-certificate true;
        open $CDN_HOST:$CDN_PORT;
        user $CDN_USER $CDN_PASSWORD;
        mirror -R $RELEASE_VERSION $CDN_DIRECTORY/;
        bye
      "
  only:
    - tags
