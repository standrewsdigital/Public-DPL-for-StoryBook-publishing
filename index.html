<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPL HTML examples</title>

  <style>
    html {
    --blue: #000036;
    --yellow: #ffb400;
    --subtle: rgba(255, 255, 255, 0.25);
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    background-color: var(--blue);
  }
    main {
      max-width: 90%;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .intro {
      color: white;
      margin-bottom: 2rem;
    }

    .file-navigation {
      margin-top: 2rem;
      max-width: 100%;

      a {
        display: block;
        padding: 0.5rem;
        color: #fff;
        font-weight: 600;
        text-decoration: underline;
      }

      a:hover {
        text-decoration: none;
      }
    }

  </style>
</head>

<body>
  <main>
    <h1>DPL HTML examples</h1>
    <p class="intro">Browse the available example pages and pattern folders.</p>
    {%showFilePaths%}
  </main>
</body>
</html>
