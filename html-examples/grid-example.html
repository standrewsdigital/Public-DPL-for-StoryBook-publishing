<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    <link rel="stylesheet" href="../compiled-css/main.css">
    <style>
        .col {
            min-height: 100px;
            background-color: #f0f0f0;
            text-align: center;
            line-height: 100px;
            /* margin-bottom: 15px; Space between rows for clarity */
        }

        /* Highlight the first and last columns for visual aid */
        .col:first-child {
            background-color: lightblue;
        }

        .col:last-child {
            background-color: lightcoral;
        }

        /* Container styling for better visibility */
        .container {
            margin-bottom: 20px;
            padding: 0; /* Override if needed based on your grid system CSS */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row">
    <div class="col col-12-sm col-12-lg">12/12</div>
</div>
</div>

<div class="container">
    <div class="row">
    <div class="col col-6-xxs col-6-lg">6/6</div>
    <div class="col col-6-xxs col-6-lg">6/6</div>
</div>
</div>

<div class="container">
    <div class="row">
    <div class="col col-4-lg col-6-xxs">4/6</div>
    <div class="col col-4-lg col-6-xxs">4/6</div>
    <div class="col col-4-lg col-12-xxs">4/12</div>
</div>
</div>

<div class="container">
    <div class="row">
    <div class="col col-3-lg col-12-sm">3/12</div>
    <div class="col col-3-lg col-12-sm">3/12</div>
    <div class="col col-3-lg col-12-sm">3/12</div>
    <div class="col col-3-lg col-12-sm">3/12</div>
</div>
</div>

<div class="container">
    <div class="row">
    <div class="col col-8-lg col-8-xxs">8/6</div>
    <div class="col col-4-lg col-4-xxs">4/6</div>
</div>
</div>

<div class="container">
    <div class="row">
    <div class="col col-4-lg col-4-xxs">4/6</div>
    <div class="col col-8-lg col-8-xxs">8/6</div>
</div>
</div>

<div class="container">
    <div class="row">
      <div class="col col-6-lg row-2-lg">6/12 
    <br/>
        spanning 2 rows</div>
      <div class="col col-6-lg">6/12</div>
      <div class="col col-3-lg">3/12</div>
      <div class="col col-3-lg">3/12</div>
      <div class="col col-12-lg">12/12 below</div>
    </div>
  </div>


</body>
</html>
