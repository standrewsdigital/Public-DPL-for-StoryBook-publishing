<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel</title>
    <link rel="stylesheet" href="../../compiled-css/main.css">
    <link rel="stylesheet" href="../../compiled-css/vertical-card.css">
</head>

<body>
    <!--Header-->
    <header class="container">
        <div class="row">
            <div class="col-12 header-content">
                <img src="https://design.st-andrews.ac.uk/assets/images/university-of-st-andrews-logo-foundation.svg"
                    alt="University of St Andrews Logo" class="logo">
            </div>
        </div>
    </header>
    <div class="pattern-wrapper">
        <!-- Page heading -->
        <div class="container">
            <div class="row">
                <div class="col col-8-md col-12-sm col-12-xxs">
                    <h1>Vertical card</h1>
                </div>
            </div>
        </div>
    </div>

    <section class="image-cards">

        <div class="container">

            <div class="row">
                <div class="col col-12-md col-12-sm col-12-xxs">
                    <h2>5 Cards</h2>
                </div>
            </div>

            <div class="row">
                <div class="col col-12-lg">

                    <!-- <button class="cards-prev" aria-label="Previous card">
                        &#10094;
                    </button> -->

                    <div class="cards-track">

                        <a href="#" class="image-card">
                            <img src="../../assets/image_1.jpg" alt="Image 1">
                            <span class="cards-title">Image 1</span>
                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_2.jpg" alt="Image 2">
                            <span class="cards-title">Image 2</span>
                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_3.jpg" alt="Image 3">

                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_4.jpg" alt="Image 4">
                            <span class="cards-title">Image 4</span>
                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_4.jpg" alt="Image 4">
                            <span class="cards-title">Image 4</span>
                        </a>

                    </div>

                    <!-- <button class="cards-next" aria-label="Next card">
                        &#10095;
                    </button> -->

                </div>
            </div>

        </div>

    </section>

                </div>
            </div>

            <div class="row">
                <div class="col col-12-lg">

                    <!-- <button class="cards-prev" aria-label="Previous card">
                        &#10094;
                    </button> -->

                    <div class="cards-track">

                        <a href="#" class="image-card">
                            <img src="../../assets/image_1.jpg" alt="Image 1">
                            <span class="cards-title">Image 1</span>
                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_2.jpg" alt="Image 2">
                            <span class="cards-title">Image 2</span>
                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_3.jpg" alt="Image 3">
                            <span class="cards-title">Image 3</span>
                        </a>

                        <a href="#" class="image-card">
                            <img src="../../assets/image_4.jpg" alt="Image 4">
                            <span class="cards-title">Image 4</span>
                        </a>

                    </div>

                    <!-- <button class="cards-next" aria-label="Next card">
                        &#10095;
                    </button> -->

            </div>

        </div>
