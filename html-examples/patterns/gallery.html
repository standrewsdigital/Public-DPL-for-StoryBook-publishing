<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email template</title>
    <link rel="stylesheet" href="../../compiled-css/main.css" />
    <link rel="stylesheet" href="../../compiled-css/gallery.css">

</head>

<body>
    <header class="container">
        <div class="row">
            <div class="col col-12-lg col-12-xxs header-content">
                <img src="https://design.st-andrews.ac.uk/assets/images/university-of-st-andrews-logo-foundation.svg"
                    alt="University of St Andrews Logo" class="logo" />
            </div>
        </div>
    </header>
    <div class="container">
        <div class="row">
            <div class="col col-12-sm col-12-lg">
                <h1>Gallery</h1>
                <h2>Full-width</h2>
            </div>
        </div>
    </div>



    <section class="gallery">

        <div class="container">

            <div class="row">

                <div class="col col-12-sm col-6-md col-3-lg">

                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image" data-caption="">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 1
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">

                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image"
                            data-caption="Gallery Caption 2 and this has a bit more added">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 2
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/500x500.jpg" alt="Gallery Image"
                            data-caption="Gallery Caption 3">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 3
                                </h3>

                            </div>
                        </div>
                    </button>
                </div>


                <div class="col col-12-sm col-6-md col-3-lg">

                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/750x500.png" alt="Gallery Image4"
                            data-caption="Gallery Caption 4">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 4
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image5"
                            data-caption="Gallery Caption 5">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 5
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">

                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/500x500.jpg" alt="Gallery Image6"
                            data-caption="Gallery Caption 6">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 6
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image7"
                            data-caption="Gallery Caption 7">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 7
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">

                    <button class="gallery__item" type="button">

                        <img class="gallery__image" src="../../assets/500x500.jpg" alt="Gallery Image8"
                            data-caption="Gallery Caption 8">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Caption 8
                                </h3>

                            </div>
                        </div>

                    </button>
                </div>
            </div>
        </div>

    </section>

    <div class="gallery__lightbox">

        <div class="gallery__panel">

            <button class="gallery__close" type="button" aria-label="Close gallery">
                &times;
            </button>
            <div class="gallery__image-wrapper">
                <button class="gallery__previous" type="button" aria-label="Previous image">
                    &#10094;
                </button>



                <img class="gallery__lightbox-image" src="" alt="">



                <button class="gallery__next" type="button" aria-label="Next image">
                    &#10095;
                </button>

            </div>

            <div class="gallery__caption">

                <p class="gallery__lightbox-caption"></p>

                <p class="gallery__lightbox-count"></p>

            </div>

        </div>

    </div>
    <br><br>
    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col col-12-lg col-12-xxs">
                    <div class="footer">
                        <div class="footer-text">
                            © 2026 The University of St Andrews is a charity registered in Scotland, No: SC013532
                        </div>
                        <div class="footer-links">
                            <a href="/cookie-preferences">Cookie preferences</a>
                            <a href="/accessibility-statement">Accessibility statement</a>
                            <a href="/terms-and-conditions">Terms and conditions</a>
                            <a href="/website-help">Website help</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="../../scripts/gallery.js"></script>
</body>

</html>
