<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email template</title>
    <link rel="stylesheet" href="../../compiled-css/main.css" />
    <link rel="stylesheet" href="../../compiled-css/gallery.css">

</head>

<body>
    <header class="container">
        <div class="row">
            <div class="col col-12-lg col-12-xxs header-content">
                <img src="https://design.st-andrews.ac.uk/assets/images/university-of-st-andrews-logo-foundation.svg"
                    alt="University of St Andrews Logo" class="logo" />
            </div>
        </div>
    </header>
    <div class="container">
        <div class="row">
            <div class="col col-12-sm col-12-lg">
                <h1>Gallery</h1>
                <h2>Full-width</h2>
            </div>
        </div>
    </div>



    <section class="gallery">

        <div class="container">

            <div class="row">

                <div class="col col-12-sm col-6-md col-3-lg">

                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image"
                            data-title="Gallery Title" data-description="Image description 1">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 1
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">

                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image"
                            data-title="Gallery Title2" data-description="Image description2">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 2
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/500x500.jpg" alt="Gallery Image"
                            data-title="Gallery Title3" data-description="Image description3">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 3
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">

                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/750x500.png" alt="Gallery Image4"
                            data-title="Gallery Title4" data-description="Image description4">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 4
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image5"
                            data-title="Gallery Title5" data-description="Image description5">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 5
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/500x500.jpg" alt="Gallery Image6"
                            data-title="Gallery Title6" data-description="Image description6">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 6
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">
                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/360x240.png" alt="Gallery Image7"
                            data-title="Gallery Title7" data-description="Image description7">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 7
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col col-12-sm col-6-md col-3-lg">

                    <div class="gallery__item">

                        <img class="gallery__image" src="../../assets/500x500.jpg" alt="Gallery Image8"
                            data-title="Gallery Title8" data-description="Image description8">

                        <div class="gallery__overlay">
                            <div class="gallery__content">
                                <h3 class="gallery__title">
                                    Gallery Title 8
                                </h3>

                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>

        </div>

    </section>

    <div class="gallery__lightbox">

        <div class="gallery__panel">

            <button class="gallery__close" type="button" aria-label="Close gallery">
                &times;
            </button>
            <div class="gallery__image-wrapper">
                <button class="gallery__previous" type="button" aria-label="Previous image">
                    &#10094;
                </button>



                <img class="gallery__lightbox-image" src="" alt="">



                <button class="gallery__next" type="button" aria-label="Next image">
                    &#10095;
                </button>

            </div>

            <div class="gallery__caption">

                <h2 class="gallery__lightbox-title"></h2>

                <p class="gallery__lightbox-description"></p>

            </div>

        </div>

    </div>



    <script src="../../scripts/gallery.js"></script>
</body>

</html>
