<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabulator</title>
    <link rel="stylesheet" href="../../compiled-css/main.css">
    <link href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet">
</head>
<body>
    <!--Header-->
    <header class="container">
        <div class="row">
            <div class="col col-12-lg col-12-xxs header-content">
                <img src="https://design.st-andrews.ac.uk/assets/images/university-of-st-andrews-logo-foundation.svg" alt="University of St Andrews Logo" class="logo">
            </div>
        </div>
    </header>
    <!--Content-->
    <div class="container">
        <div class="row">
            <div class="col-centered col-12-md">
                <div id="example-table"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col col-12-lg col-12-xxs">
                        <div class="footer-text">
                            © 2024 The University of St Andrews is a charity registered in Scotland, No: SC013532
                        </div>
                        <div class="footer-links">
                            <a href="/cookie-preferences">Cookie preferences</a>
                            <a href="/accessibility-statement">Accessibility statement</a>
                            <a href="/terms-and-conditions">Terms and conditions</a>
                            <a href="/website-help">Website help</a>
                        </div>
                    </div>
            </div>
        </div>
    </footer>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
  <script>
    //define data array
    var tabledata = [
        {id:1, name:"Oli Bob", progress:12, rating:1, col:"red", dob:"19/02/1984"},
        {id:2, name:"Mary May", progress:1, rating:2, col:"blue", dob:"14/05/1982"},
        {id:3, name:"Christine Lobowski", progress:42, rating:0, col:"green", dob:"22/05/1982"},
        {id:4, name:"Brendon Philips", progress:100, rating:1, col:"orange", dob:"01/08/1980"},
        {id:5, name:"Margret Marmajuke", progress:16, rating:5, col:"yellow", dob:"31/01/1999"},
        {id:6, name:"Frank Harbours", progress:38, rating:4, col:"red", dob:"12/05/1966"},
    ];

    //initialize table
    var table = new Tabulator("#example-table", {
        data:tabledata, //assign data to table
        autoColumns:true, //create columns from data field names
        layout:"fitColumns",      //fit columns to width of table
        responsiveLayout:"hide",  //hide columns that don't fit on the table
        addRowPos:"top",          //when adding a new row, add it to the top of the table
        history:true,             //allow undo and redo actions on the table
        pagination:"local",       //paginate the data
        paginationSize:7,         //allow 7 rows per page of data
        paginationCounter:"rows", //display count of paginated rows in footer
        movableColumns:true,      //allow column order to be changed
        initialSort:[             //set the initial sort order of the data
            {column:"name", dir:"asc"},
        ],
    });

  </script>
</body>
</html>
