<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article header</title>
    <link rel="stylesheet" href="../compiled-css/main.css">
    <link rel="stylesheet" href="../compiled-css/tags.css">
</head>
<div class="pattern-wrapper">
    <header class="container">
        <div class="col-8 header-content">
            <img src="https://design.st-andrews.ac.uk/assets/images/university-of-st-andrews-logo-foundation.svg"
                alt="University of St Andrews Logo" class="logo">
        </div>
    </header>
    <div class="flex-wrapper">
        <!-- Begin pattern: tags //-->
        <div class="pattern-wrapper">
            <div class="container">
                <div class="col-12 row">
                    <div class="tags">
                        <span class="sta-tag">No status</span>
                        <span class="sta-tag sta-tag--success font-scale-reset">Success</span>
                        <span class="sta-tag sta-tag--info font-scale-reset">Information</span>
                        <span class="sta-tag sta-tag--warning font-scale-reset">Warning</span>
                        <span class="sta-tag sta-tag--danger font-scale-reset">Danger</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End pattern: tags //-->

    <!-- Begin pattern: tags //-->
    <div class="pattern-wrapper">
        <div class="container">
            <div class="col-12 row">
                <div class="tags">
                    <span class="sta-tag font-scale-0">No status</span>
                    <span class="sta-tag sta-tag--success font-scale-1">Success</span>
                    <span class="sta-tag sta-tag--info font-scale-2">Information</span>
                    <span class="sta-tag sta-tag--warning font-scale-3">Warning</span>
                    <span class="sta-tag sta-tag--danger font-scale-4">Danger</span>
                </div>
            </div>
        </div>
    </div>
    <!-- End pattern: tags //-->
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-text col-12">
                © 2024 The University of St Andrews is a charity registered in Scotland, No: SC013532
            </div>
            <div class="footer-links col-12">
                <a href="/cookie-preferences">Cookie preferences</a>
                <a href="/accessibility-statement">Accessibility statement</a>
                <a href="/terms-and-conditions">Terms and conditions</a>
                <a href="/website-help">Website help</a>
            </div>
        </div>
    </footer>
</div>
</body>

</html>
